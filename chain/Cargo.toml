[package]
name = "crownfall-realm"
description = "Crownfall: eight houses, eight memecoins. Hall games burn coin, chariot races run on chain, the Seven Wardens' seals are kept here."
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
