[package]
name = "crownfall-realm"
description = "Crownfall: eight houses, eight memecoins. Hall games burn coin, chariot races run on chain, the Seven Wardens' seals are kept here."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/neromtoobad/crownfall"

[lib]
crate-type = ["cdylib", "rlib"]

# `cargo near build reproducible-wasm` builds in this pinned image, so anyone can rebuild the deployed code and get the
# same hash. The deployed contract carries this repo, commit and image in `contract_source_metadata`.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30"
uint = { version = "0.10", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
